# Shared CI/CD: see deploy/CI-CD.md.
name: Validate fiscal
'on':
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      full:
        type: boolean
        default: false
      publish:
        type: boolean
        default: false
    outputs:
      engine_digest:
        description: Validated registry image digest
        value: ${{ jobs.fiscal-engine.outputs.digest }}
      mcp_digest:
        description: Validated registry image digest
        value: ${{ jobs.fiscal-mcp.outputs.digest }}
jobs:
  fiscal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - run: npm ci --ignore-scripts --no-audit --no-fund
      working-directory: apps/fiscal-engine
    - run: npm test
      working-directory: apps/fiscal-engine
    - run: docker build -f apps/fiscal-engine/Dockerfile -t erp-next-fiscal:sha-${{ inputs.source_sha }} .
      if: inputs.full
    - uses: pnpm/action-setup@v4
      with:
        version: 11.11.0
    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm
    - run: pnpm install --frozen-lockfile --prefer-offline
    - run: pnpm test:fiscal-integrations
    - uses: docker/login-action@v3
      if: inputs.publish
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish fiscal by immutable digest
      id: image
      if: inputs.publish
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/fiscal-engine/Dockerfile
        push: true
        tags: ghcr.io/avilaops/erp-next-fiscal:sha-${{ inputs.source_sha }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
  fiscal-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.source_sha }}
        persist-credentials: false
    - uses: astral-sh/setup-uv@v6
      with:
        version: 0.12.24
    - run: uv sync --frozen --extra dev --python 3.12
      working-directory: apps/fiscal-mcp
    - run: node --test scripts/fiscal/test/deploy-config.test.mjs
    - run: uv run --frozen --extra dev pytest tests/test_fiscal_schema.py tests/test_simplified_danfe.py tests/test_nfe_assinatura.py
      working-directory: apps/fiscal-mcp
    - run: docker build -f apps/fiscal-mcp/Dockerfile -t erp-next-fiscal-mcp:sha-${{ inputs.source_sha }} .
      if: inputs.full
    - name: Exercise MCP in its restricted runtime container
      shell: bash
      run: 'docker run --detach --name fiscal-mcp-smoke --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 --security-opt no-new-privileges:true
        --cap-drop ALL --memory 512m --pids-limit 128 -e XDG_CACHE_HOME=/tmp/cache erp-next-fiscal-mcp:sha-${{ inputs.source_sha }}

        trap ''docker rm -f fiscal-mcp-smoke >/dev/null 2>&1 || true'' EXIT

        cd apps/fiscal-mcp

        uv run --frozen --extra dev python scripts/smoke_runtime.py

        '
      if: inputs.full
    - uses: docker/login-action@v3
      if: inputs.publish
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish fiscal-mcp by immutable digest
      id: image
      if: inputs.publish
      uses: docker/build-push-action@v6
      with:
        context: .
        file: apps/fiscal-mcp/Dockerfile
        push: true
        tags: ghcr.io/avilaops/erp-next-fiscal-mcp:sha-${{ inputs.source_sha }}
    outputs:
      digest: ${{ steps.image.outputs.digest }}
