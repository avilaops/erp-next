name: Assistant integration
on:
  pull_request:
    paths:
      - 'apps/api/src/domains/assistant/**'
      - 'apps/api/src/http/assistant_tests.rs'
      - 'apps/web/src/features/assistant/**'
      - 'apps/web/src/app/api/erp/assistant/**'
      - 'apps/web/src/app/assistente/**'
      - 'apps/web/tests/assistant.spec.ts'
      - 'apps/web/playwright.assistant.config.ts'
      - 'scripts/verify-company.mjs'
      - '.github/workflows/assistant.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: erp_test
          POSTGRES_PASSWORD: assistant_ci_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U erp_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://erp_test:assistant_ci_only@127.0.0.1:5432/postgres
      COMPANY_TEST_DATABASE_URL: postgres://erp_test:assistant_ci_only@127.0.0.1:5432/postgres
      ERP_TEST_API_BINARY: target/debug/erp-next-api
      ERP_TEST_BROWSER_CONFIG: playwright.assistant.config.ts
      ERP_BROWSER_CHANNEL: chrome
      ERP_ASSISTANT_OLLAMA_URL: http://127.0.0.1:11434
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: cargo test --locked -p erp-next-api assistant -- --test-threads=1
      - run: cargo build --locked -p erp-next-api
      - name: Export same-revision API contract
        run: |
          mkdir -p artifacts/contracts
          ERP_OPENAPI_OUTPUT="$PWD/artifacts/contracts/candidate.json" cargo test --locked -p erp-next-api export_openapi_contract_artifact -- --nocapture
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/contracts/consumer
      - run: node scripts/contracts/generate-web.mjs
      - run: pnpm --filter web build
      - name: Start the same CPU inference distribution
        run: |
          docker run -d --name assistant-test --memory 2g --memory-swap 2g --cpus 1.5 -p 127.0.0.1:11434:11434 -e OLLAMA_NO_CLOUD=1 -e OLLAMA_NUM_PARALLEL=1 -e OLLAMA_MAX_LOADED_MODELS=1 -e OLLAMA_MAX_QUEUE=1 alpine/ollama@sha256:d81e4e3a38eefb991891fd1a19e3e34832e239ea4b0c211cdde9a70c13b882e6
          for attempt in $(seq 1 30); do
            curl -fsS http://127.0.0.1:11434/api/version && break
            sleep 1
          done
          curl --fail --silent --show-error --max-time 300 http://127.0.0.1:11434/api/pull -H 'Content-Type: application/json' -d '{"model":"qwen3:1.7b","stream":false}'
      - name: Browser, BFF, Rust, RLS and real local model
        run: node scripts/verify-company.mjs
      - name: Native tool selection for every read domain
        run: cargo test --locked -p erp-next-api real_model_selects_read_tools -- --ignored --test-threads=1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assistant-browser-${{ github.run_id }}
          path: apps/web/test-results/
          if-no-files-found: warn
          retention-days: 7
