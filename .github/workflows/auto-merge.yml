name: Auto merge validated PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: erp-auto-merge-main
  cancel-in-progress: false

jobs:
  merge-and-release:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge the exact candidate approved by CI and start production release
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]

          candidate=$(gh api "repos/$GH_REPO/pulls/$PR")
          if ! jq -e --arg repo "$GH_REPO" --arg head "$EXPECTED_HEAD" '
            .state == "open" and .draft == false and .base.ref == "main" and
            .head.repo.full_name == $repo and .head.sha == $head and .mergeable == true
          ' <<<"$candidate" >/dev/null; then
            echo '::notice::PR is a draft, has changed, or is not currently mergeable.'
            exit 0
          fi

          tested_merge=$(jq -er '.merge_commit_sha | select(test("^[a-f0-9]{40}$"))' <<<"$candidate")
          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "gate" and .conclusion == "success") | .id' | grep -E '^[0-9]+
          trap 'rm -rf "$evidence"' EXIT
          gh run download "$RUN_ID" --name "erp-mlops-ci-$tested_merge-$ATTEMPT" --dir "$evidence"
          jq -e --arg repo "$GH_REPO" --arg head "$EXPECTED_HEAD" --arg tested "$tested_merge" \
            --argjson run "$RUN_ID" --argjson attempt "$ATTEMPT" '
              .schema == "avila-mlops-ci-attestation/1" and .repository == $repo and
              .workflow == "CI" and .event == "pull_request" and .sourceSha == $head and
              .testedSha == $tested and .runId == $run and .runAttempt == $attempt and
              .ciGate == "passed" and (.validationJobs | length > 0 and all(.[]; . == "success"))
            ' "$evidence/ci-attestation.json" >/dev/null

          # GitHub still enforces the protected branch rules on this merge.
          result=$(gh api --method PUT "repos/$GH_REPO/pulls/$PR/merge" -f sha="$EXPECTED_HEAD" -f merge_method=merge)
          release_sha=$(jq -er 'select(.merged == true) | .sha | select(test("^[a-f0-9]{40}$"))' <<<"$result")
          # A merge by GITHUB_TOKEN does not trigger a separate push workflow.
          gh workflow run production-release.yml --ref main -f source_ref="$release_sha"
 >/dev/null
          evidence=$(mktemp -d)
          trap 'rm -rf "$evidence"' EXIT
          gh run download "$RUN_ID" --name "erp-mlops-ci-$tested_merge-$ATTEMPT" --dir "$evidence"
          jq -e --arg repo "$GH_REPO" --arg head "$EXPECTED_HEAD" --arg tested "$tested_merge" \
            --argjson run "$RUN_ID" --argjson attempt "$ATTEMPT" '
              .schema == "avila-mlops-ci-attestation/1" and .repository == $repo and
              .workflow == "CI" and .event == "pull_request" and .sourceSha == $head and
              .testedSha == $tested and .runId == $run and .runAttempt == $attempt and
              .ciGate == "passed" and (.validationJobs | length > 0 and all(.[]; . == "success"))
            ' "$evidence/ci-attestation.json" >/dev/null

          # GitHub still enforces the protected branch rules on this merge.
          result=$(gh api --method PUT "repos/$GH_REPO/pulls/$PR/merge" -f sha="$EXPECTED_HEAD" -f merge_method=merge)
          release_sha=$(jq -er 'select(.merged == true) | .sha | select(test("^[a-f0-9]{40}$"))' <<<"$result")
          # A merge by GITHUB_TOKEN does not trigger a separate push workflow.
          gh workflow run production-release.yml --ref main -f source_ref="$release_sha"
