name: Auto merge validated PRs

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: erp-auto-merge-main
  queue: max

jobs:
  merge:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR: ${{ github.event.workflow_run.pull_requests[0].number }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Merge the exact candidate approved by scoped CI
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR" =~ ^[0-9]+$ && "$RUN_ID" =~ ^[0-9]+$ && "$ATTEMPT" =~ ^[0-9]+$ ]]
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]

          candidate=$(gh api "repos/$GH_REPO/pulls/$PR")
          if ! jq -e --arg repo "$GH_REPO" --arg head "$EXPECTED_HEAD" '
            .base.ref == "main" and
            .head.repo.full_name == $repo and .head.sha == $head and
            ((.state == "open" and .mergeable == true) or (.state == "closed" and .merged == true))
          ' <<<"$candidate" >/dev/null; then
            echo '::notice::PR has changed or is not an eligible merge candidate.'
            exit 0
          fi

          gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.name == "gate" and .conclusion == "success") | .id' | grep -E '^[0-9]+$' >/dev/null
          # Find the tested synthetic merge even after the PR has been merged.
          artifacts=$(gh api --paginate "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')
          mapfile -t matches < <(printf '%s\n' "$artifacts" | grep -E "^erp-mlops-ci-[a-f0-9]{40}-$ATTEMPT$")
          [[ "${#matches[@]}" == 1 ]]
          artifact=${matches[0]}
          tested_merge=${artifact#erp-mlops-ci-}
          tested_merge=${tested_merge%-$ATTEMPT}
          if jq -e '.state == "open"' <<<"$candidate" >/dev/null; then
            [[ "$(jq -er '.merge_commit_sha' <<<"$candidate")" == "$tested_merge" ]]
          fi
          evidence=$(mktemp -d)
          trap 'rm -rf "$evidence"' EXIT
          gh run download "$RUN_ID" --name "$artifact" --dir "$evidence"
          jq -e --arg repo "$GH_REPO" --arg head "$EXPECTED_HEAD" --arg tested "$tested_merge" \
            --argjson run "$RUN_ID" --argjson attempt "$ATTEMPT" '
              .schema == "avila-mlops-ci-attestation/2" and .repository == $repo and
              .workflow == "CI" and .event == "pull_request" and .sourceSha == $head and
              .testedSha == $tested and .runId == $run and .runAttempt == $attempt and
              .ciGate == "passed" and
              (.validationScope | keys == ["api", "fiscal", "web"]) and
              (.validationJobs | keys == ["api", "changes", "fiscal", "web"]) and
              .validationJobs.changes == "success" and
              all(.validationScope | to_entries[];
                (.value | type) == "boolean") and
              (. as $e | all(["api", "fiscal", "web"][];
                $e.validationJobs[.] == (if $e.validationScope[.] then "success" else "skipped" end)))
            ' "$evidence/ci-attestation.json" >/dev/null

          if jq -e '.state == "open"' <<<"$candidate" >/dev/null; then
            if jq -e '.draft' <<<"$candidate" >/dev/null; then
              gh pr ready "$PR"
            fi
            # GitHub still enforces the protected branch rules on this merge.
            result=$(gh api --method PUT "repos/$GH_REPO/pulls/$PR/merge" -f sha="$EXPECTED_HEAD" -f merge_method=merge)
            release_sha=$(jq -er 'select(.merged == true) | .sha | select(test("^[a-f0-9]{40}$"))' <<<"$result")
          else
            # Recheck an already merged candidate without merging it again.
            release_sha=$(jq -er '.merge_commit_sha | select(test("^[a-f0-9]{40}$"))' <<<"$candidate")
          fi
          tested_commit=$(gh api "repos/$GH_REPO/git/commits/$tested_merge")
          release_commit=$(gh api "repos/$GH_REPO/git/commits/$release_sha")
          jq -e --arg head "$EXPECTED_HEAD" --argjson tested "$tested_commit" '
            .tree.sha == $tested.tree.sha and (.parents | length) == 2 and
            .parents[1].sha == $head and ($tested.parents | length) == 2 and
            $tested.parents[1].sha == $head
          ' <<<"$release_commit" >/dev/null
          # Merges made with GITHUB_TOKEN do not trigger push workflows.
          # An explicit retry can also recover a failed dispatch for the current main.
          if [[ "$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)" == "$release_sha" ]]; then
            gh workflow run production-release.yml --ref main \
              -f source_ref="$release_sha" -f automatic=true
            # Bot merges also suppress the branch updater's main push trigger.
            gh workflow run update-pr-branches.yml --ref main ||
              echo '::warning::Could not dispatch the branch updater.'
          fi


          branch=$(jq -er '.head.ref' <<<"$candidate")
          default_branch=$(gh api "repos/$GH_REPO" --jq .default_branch)
          if [[ "$branch" == main || "$branch" == "$default_branch" ]]; then
            exit 0
          fi
          # Preserve branches still used as the source or base of another PR.
          open_prs=$(gh api --paginate --slurp "repos/$GH_REPO/pulls?state=open&per_page=100")
          if jq -e --arg branch "$branch" --arg repo "$GH_REPO" '
            any(.[][]; .base.ref == $branch or (.head.ref == $branch and .head.repo.full_name == $repo))
          ' <<<"$open_prs" >/dev/null; then
            exit 0
          fi
          git init --quiet "$evidence/repo"
          gh auth setup-git
          ref="refs/heads/$branch"
          if ! git -C "$evidence/repo" push --force-with-lease="$ref:$EXPECTED_HEAD" "https://github.com/$GH_REPO.git" ":$ref"; then
            echo '::notice::Branch already removed, updated since merge, or protected.'
          fi
