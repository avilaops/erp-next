name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_next_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_next_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:erp_next_ci_only@127.0.0.1:5432/erp_next_test
    steps:
      - run: echo "ERP_CI_DEADLINE=$(( $(date +%s) + 65 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          key: rust-test-dependencies-v1
          cmd-format: "rustup run 1.99.1 {0}"
      - run: |
          remaining=$((ERP_CI_DEADLINE - $(date +%s)))
          (( remaining > 0 ))
          timeout "${remaining}s" cargo fmt --all --check
      - run: |
          remaining=$((ERP_CI_DEADLINE - $(date +%s)))
          (( remaining > 0 ))
          timeout "${remaining}s" cargo clippy --workspace --all-targets -- -D warnings
      - run: |
          remaining=$((ERP_CI_DEADLINE - $(date +%s)))
          (( remaining > 0 ))
          timeout "${remaining}s" cargo test --workspace -- --test-threads=4

  web:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - run: echo "ERP_CI_DEADLINE=$(( $(date +%s) + 65 ))" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate web
        shell: bash
        run: |
          remaining=$((ERP_CI_DEADLINE - $(date +%s)))
          (( remaining > 0 ))
          timeout "${remaining}s" pnpm --filter web lint & lint_pid=$!
          timeout "${remaining}s" pnpm --filter web build & build_pid=$!
          wait "$lint_pid"
          wait "$build_pid"
      - run: |
          remaining=$((ERP_CI_DEADLINE - $(date +%s)))
          (( remaining > 0 ))
          timeout "${remaining}s" pnpm --filter web test:danfe
        env:
          ERP_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-danfe-browser-${{ github.run_id }}
          path: artifacts/danfe-browser/
          if-no-files-found: warn

