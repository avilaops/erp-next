# Shared CI/CD: see deploy/CI-CD.md.
name: CI
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      web: ${{ steps.scope.outputs.web }}
      api: ${{ steps.scope.outputs.api }}
      fiscal: ${{ steps.scope.outputs.fiscal }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - id: scope
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha || format('{0}^', github.sha) }}
      run: python3 -B scripts/ci/pr-gate.py plan
  api:
    needs:
    - changes
    if: needs.changes.outputs.api == 'true'
    uses: ./.github/workflows/_validate-api.yml
    with:
      source_sha: ${{ github.sha }}
      full: false
      publish: false
  web:
    needs:
    - changes
    if: needs.changes.outputs.web == 'true'
    uses: ./.github/workflows/_validate-web.yml
    with:
      source_sha: ${{ github.sha }}
      full: false
      publish: false
  fiscal:
    needs:
    - changes
    if: needs.changes.outputs.fiscal == 'true'
    uses: ./.github/workflows/_validate-fiscal.yml
    with:
      source_sha: ${{ github.sha }}
      full: false
      publish: false
  project:
    needs:
    - changes
    uses: ./.github/workflows/_validate-project.yml
    with:
      source_sha: ${{ github.sha }}
      full: false
      check_database: ${{ needs.changes.outputs.api == 'true' }}
  gate:
    needs:
    - changes
    - api
    - web
    - fiscal
    - project
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Require selected validations and report explicit skips
      env:
        JOBS: ${{ toJSON(needs) }}
      run: "python3 - <<'PY'\nimport json, os\njobs = json.loads(os.environ['JOBS'])\nscope = jobs['changes']['outputs']\npassed = jobs['changes']['result'] == 'success'\
        \ and jobs['project']['result'] == 'success'\nfor name in ('api', 'web', 'fiscal'):\n    passed &= scope.get(name) in ('true', 'false') and jobs[name]['result']\
        \ == ('success' if scope.get(name) == 'true' else 'skipped')\nwith open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:\n    output.write('## CI por escopo\\\
        n\\n' + '\\n'.join(f\"- {name}: {job['result']}\" for name, job in jobs.items()))\nraise SystemExit(0 if passed else 1)\nPY"
'on':
  pull_request: {}
  workflow_dispatch: {}
