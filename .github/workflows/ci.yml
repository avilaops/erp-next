name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_next_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_next_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:erp_next_ci_only@127.0.0.1:5432/erp_next_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Test OpenAPI compatibility gate
        run: |
          bash scripts/contracts/install-oasdiff.sh
          "$RUNNER_TEMP/erp-oasdiff-1.34.1/oasdiff" --version
      - run: node --test scripts/contracts/test/*.test.mjs
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: |
          mkdir -p artifacts/contracts
          ERP_COMPANY_CONTRACT_OUTPUT="$GITHUB_WORKSPACE/artifacts/contracts/company.json" cargo test --workspace --locked -- --test-threads=1
      - name: Capture contracts from tested revision and explicit base
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 -B scripts/contracts/capture.py "$BASELINE_SHA"
      - name: Compare OpenAPI with explicit baseline
        run: node scripts/contracts/gate.mjs artifacts/contracts/baseline.json artifacts/contracts/candidate.json artifacts/contracts
      - name: Check fixed company consumer
        working-directory: scripts/contracts/consumer
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run generate
          npm run check
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-openapi-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/contracts/
          if-no-files-found: warn
          retention-days: 14

  web:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate web
        shell: bash
        run: |
          pnpm --filter web lint & lint_pid=$!
          pnpm --filter web build & build_pid=$!
          wait "$lint_pid"
          wait "$build_pid"
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:danfe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-danfe-browser-${{ github.run_id }}
          path: artifacts/danfe-browser/
          if-no-files-found: warn

