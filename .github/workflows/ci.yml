name: CI

on:
  workflow_dispatch:
    inputs:
      provision:
        description: Apply migrations and initial access to the isolated ERP Next database
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provision:
    if: github.event_name == 'workflow_dispatch' && inputs.provision
    needs: [rust, web, experiments]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.ERP_MIGRATION_DATABASE_URL }}
      ERP_BOOTSTRAP_SUB: ${{ secrets.ERP_BOOTSTRAP_SUB }}
      ERP_BOOTSTRAP_TENANT: ${{ secrets.ERP_BOOTSTRAP_TENANT }}
      ERP_BOOTSTRAP_EMAIL: nicolas@avilaops.com
    steps:
      - uses: actions/checkout@v4
      - name: Open restricted database tunnel
        env:
          SSH_KEY: ${{ secrets.ERP_DB_TUNNEL_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ERP_DB_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERP_DB_SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/erp-db
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/erp-db ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -i ~/.ssh/erp-db -N -f -L 127.0.0.1:15435:172.17.0.1:5432 root@"$SSH_HOST"
      - name: Apply migrations from the CI image
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "erp-api-$GITHUB_SHA"
          docker load --input api-image.tar.gz
          docker run --rm --network host --env DATABASE_URL "erp-next-api:sha-$GITHUB_SHA" migrate
      - name: Provision initial membership and runtime grants
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f deploy/bootstrap.sql

  experiments:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            experiments/package-lock.json
            experiments/dashboard/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm ci --no-audit --no-fund
        working-directory: experiments/dashboard
      - run: npm run build
        working-directory: experiments/dashboard
      - run: npm test
        working-directory: experiments/dashboard
      - run: npx playwright install --with-deps chromium
        working-directory: experiments/dashboard
      - run: npm run test:ui
        working-directory: experiments/dashboard
      - run: node scripts/ui-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiments-ui-${{ github.run_id }}-${{ github.run_attempt }}
          path: experiments/reports/ui-check/
          if-no-files-found: ignore

  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_next_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_next_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:erp_next_ci_only@127.0.0.1:5432/erp_next_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace -- --test-threads=1
      - run: cargo build --release --locked -p erp-next-api
      - run: docker build -f deploy/api.Dockerfile -t erp-next-api:sha-${{ github.sha }} .
      - run: docker save erp-next-api:sha-${{ github.sha }} | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-api-${{ github.sha }}
          path: api-image.tar.gz

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate web
        shell: bash
        run: |
          pnpm --filter web lint & lint_pid=$!
          pnpm --filter web build & build_pid=$!
          wait "$lint_pid"
          wait "$build_pid"
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:danfe
      - run: docker build -f deploy/web.Dockerfile -t erp-next-web:sha-${{ github.sha }} .
      - name: Check packaged web runtime
        run: |
          docker run -d --name erp-web-smoke -p 127.0.0.1:33120:3000 \
            -e ERP_WEB_ORIGIN=http://127.0.0.1:3000 \
            -e ERP_API_URL=http://127.0.0.1:8080 \
            -e ERP_SESSION_SECRET=ci-runtime-fixture-with-more-than-32-bytes \
            erp-next-web:sha-${{ github.sha }}
          trap 'docker rm -f erp-web-smoke' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:33120/entrar > /dev/null; then break; fi
            sleep 1
          done
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:33120/api/erp/company)" = 401
      - run: docker save erp-next-web:sha-${{ github.sha }} | gzip > web-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-web-${{ github.sha }}
          path: web-image.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-danfe-browser-${{ github.run_id }}
          path: artifacts/danfe-browser/
          if-no-files-found: warn

