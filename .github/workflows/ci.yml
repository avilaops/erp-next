name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always
  npm_config_fetch_retries: 0
  npm_config_fetch_timeout: 10000

jobs:
  context-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:architecture
      - name: Validate MLOps release evidence gate (deterministic fixtures)
        run: node --test scripts/mlops/release-gate.test.mjs
      - name: Enforce documented architecture
        run: |
          mkdir -p artifacts
          pnpm --silent check:architecture > artifacts/architecture.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-architecture-${{ github.sha }}
          path: artifacts/architecture.json
      - run: pnpm context:erp

  fiscal-engine:
    timeout-minutes: 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/fiscal-engine
      - run: npm test
        working-directory: apps/fiscal-engine

  rust-build:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cargo/bin
            /home/runner/.cargo/.crates.toml
            /home/runner/.cargo/.crates2.json
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            ${{ github.workspace }}/target
          key: v0-rust-rust-Linux-x64-daeb8fa6-9ef83cd1
      - name: Compile complete Rust test suite
        run: |
          mkdir -p artifacts
          timeout 480s cargo test --workspace --locked --no-run --message-format=json > artifacts/rust-build.jsonl
          python3 -B scripts/contracts/package-test-binary.py
      - uses: actions/upload-artifact@v4
        with:
          name: erp-rust-tests-${{ github.sha }}
          path: artifacts/rust-tests/
          if-no-files-found: error
          retention-days: 1

  rust:
    needs: rust-build
    # The test command can use five minutes by itself. Leave time for Postgres and artifacts.
    timeout-minutes: 7
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: erp_next_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d erp_next_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:erp_next_ci_only@127.0.0.1:5432/erp_next_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: erp-rust-tests-${{ github.sha }}
          path: artifacts/rust-tests/
      - name: Test Rust and export candidate contract
        run: timeout 300s python3 -B scripts/contracts/run-test-binaries.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-openapi-candidate-${{ github.sha }}
          path: artifacts/contracts/
          if-no-files-found: error
          retention-days: 14

  rust-lint:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy,rustfmt
      - uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cargo/bin
            /home/runner/.cargo/.crates.toml
            /home/runner/.cargo/.crates2.json
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            ${{ github.workspace }}/target
          key: v0-rust-rust-Linux-x64-daeb8fa6-9ef83cd1
      - name: Check Rust formatting and preserve a repair patch
        run: |
          if ! cargo fmt --all --check; then
            mkdir -p artifacts
            cargo fmt --all
            git diff --binary > artifacts/rustfmt.patch
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: erp-rustfmt-${{ github.sha }}
          path: artifacts/rustfmt.patch
          if-no-files-found: ignore
      - run: timeout 480s cargo clippy --workspace --all-targets -- -D warnings

  contract-tests:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/contracts/consumer
      - run: bash scripts/contracts/install-oasdiff.sh
      - run: node --test scripts/contracts/test/*.test.mjs
      - run: python3 -B -m unittest discover -s scripts/contracts -p 'test_capture.py'

  baseline:
    needs: rust
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.cargo/bin
            /home/runner/.cargo/.crates.toml
            /home/runner/.cargo/.crates2.json
            /home/runner/.cargo/registry
            /home/runner/.cargo/git
            ${{ github.workspace }}/target
          key: v0-rust-rust-Linux-x64-daeb8fa6-9ef83cd1
      - uses: actions/download-artifact@v4
        with:
          name: erp-openapi-candidate-${{ github.sha }}
          path: artifacts/contracts/
      - name: Capture explicit baseline
        env:
          BASELINE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: timeout 480s python3 -B scripts/contracts/capture.py "$BASELINE_SHA"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-openapi-captured-${{ github.sha }}
          path: artifacts/contracts/
          if-no-files-found: error
          retention-days: 14

  contracts:
    needs: baseline
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: erp-openapi-captured-${{ github.sha }}
          path: artifacts/contracts/
      - run: bash scripts/contracts/install-oasdiff.sh
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/contracts/consumer
      - run: node scripts/contracts/gate.mjs artifacts/contracts/baseline.json artifacts/contracts/candidate.json artifacts/contracts
      - name: Verify fiscal integration examples against the generated OpenAPI
        run: node scripts/fiscal/check-contract.mjs artifacts/contracts/candidate.json
      - name: Check fixed company consumer
        working-directory: scripts/contracts/consumer
        run: |
          npm run generate
          npm run check
          npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-openapi-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/contracts/
          if-no-files-found: error
          retention-days: 14

  gate:
    needs: [context-source, fiscal-engine, rust-build, rust, rust-lint, contract-tests, baseline, contracts, web, web-lint, web-browser]
    if: always()
    timeout-minutes: 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the MLOps evidence exporter
        run: python3 -B -m unittest discover -s scripts/mlops -p 'test_*.py'
      - name: Export immutable CI evidence with source and tested merge SHAs
        if: always()
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: python3 -B scripts/mlops/export-ci-gate.py artifacts/mlops/ci-attestation.json
      - name: Preserve CI gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: erp-mlops-ci-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/mlops/ci-attestation.json
          if-no-files-found: error
          retention-days: 14
      - name: Require every validation job to succeed
        env:
          VALIDATION_JOBS: ${{ toJSON(needs) }}
        run: python3 -c 'import json,os,sys; jobs=json.loads(os.environ["VALIDATION_JOBS"]); sys.exit(0 if jobs and all(job["result"] == "success" for job in jobs.values()) else 1)'

  web:
    needs: rust
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: erp-openapi-candidate-${{ github.sha }}
          path: artifacts/contracts/
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/contracts/consumer
      - run: node scripts/contracts/generate-web.mjs
      - run: timeout 120s pnpm --filter web build
      - uses: actions/upload-artifact@v4
        with:
          name: erp-web-build-${{ github.sha }}
          path: |
            apps/web/.next/
            !apps/web/.next/cache/
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  web-lint:
    timeout-minutes: 1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - run: timeout 35s pnpm --filter web lint
      - run: node --test tests/*-model.node.mjs
        working-directory: apps/web

  web-browser:
    needs: web
    timeout-minutes: 7
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --prefer-offline
      - uses: actions/download-artifact@v4
        with:
          name: erp-web-build-${{ github.sha }}
          path: apps/web/.next/
      - name: Reserve browser fixture ports outside ephemeral allocation
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=33118-33120,33128-33130,33928-33929,33941
      - name: Verify secure session cookie removal in the browser
        if: matrix.shard == 1
        run: timeout 90s pnpm --filter web exec playwright test --config playwright.session.config.ts
        env:
          ERP_BROWSER_CHANNEL: chrome
      - run: timeout 240s pnpm --filter web test:danfe --shard=${{ matrix.shard }}/2
        env:
          ERP_BROWSER_CHANNEL: chrome
      - run: timeout 120s pnpm --filter web test:monitor
        if: matrix.shard == 1
        env:
          ERP_BROWSER_CHANNEL: chrome
      - name: Verify registry lookups and tenant isolation
        if: matrix.shard == 2
        run: timeout 90s pnpm --filter web exec playwright test --config playwright.registry.config.ts
        env:
          ERP_BROWSER_CHANNEL: chrome
      - name: Verify proposal forms and command recovery
        if: matrix.shard == 2
        run: timeout 90s pnpm --filter web exec playwright test --config playwright.proposals.config.ts
        env:
          ERP_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: erp-danfe-browser-${{ github.run_id }}-${{ matrix.shard }}
          path: artifacts/danfe-browser/
          if-no-files-found: warn

