name: ERP context synchronization

on:
  push:
    branches: [main]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Capture the exact version currently served by ERP and request independent confirmation
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: erp-context-synchronization
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Select code capture or the exact served release
        id: source
        env:
          CONFIRM_PRODUCTION: ${{ github.event_name == 'schedule' || inputs.confirm_production == true }}
        run: |
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, existsSync } from 'node:fs';
          if (process.env.CONFIRM_PRODUCTION === 'true') {
            const response = await fetch('https://erp.avilaops.com/api/health', { redirect: 'error', signal: AbortSignal.timeout(10000) });
            const health = await response.json();
            if (!response.ok || health.ok !== true || health.application !== 'erp-next' || !/^[a-f0-9]{40}$/.test(health.commit)) throw new Error('Served ERP version unavailable');
            execFileSync('git', ['fetch', '--depth=1', 'origin', health.commit], { stdio: 'inherit' });
            execFileSync('git', ['checkout', '--detach', health.commit], { stdio: 'inherit' });
          }
          const supported = existsSync('verification/product-context-publish.mjs');
          appendFileSync(process.env.GITHUB_OUTPUT, `supported=${supported}\n`);
          if (!supported) console.log('::notice::The served release predates context publishing; no context or publication observation was fabricated.');
          JS
      - uses: pnpm/action-setup@v4
        if: steps.source.outputs.supported == 'true'
        with:
          version: 11.11.0
      - run: pnpm install --frozen-lockfile
        if: steps.source.outputs.supported == 'true'
      - name: Import context and verify the receipt and stored bytes
        if: steps.source.outputs.supported == 'true'
        env:
          ERP_CONTEXT_LAB_TOKEN: ${{ secrets.ERP_CONTEXT_LAB_TOKEN }}
          CONFIRM_PRODUCTION: ${{ github.event_name == 'schedule' || inputs.confirm_production == true }}
        run: |
          if [ "$CONFIRM_PRODUCTION" = 'true' ]; then
            pnpm context:erp:publish --confirm-production
          else
            pnpm context:erp:publish
          fi
      - uses: actions/upload-artifact@v4
        if: always() && steps.source.outputs.supported == 'true'
        with:
          name: erp-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/product-context/
          if-no-files-found: warn
          retention-days: 30
