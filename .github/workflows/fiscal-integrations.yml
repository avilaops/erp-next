name: Fiscal integrations

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  fiscal-integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test:fiscal-integrations
