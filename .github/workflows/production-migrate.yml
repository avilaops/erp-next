name: Production migrate

on:
  workflow_dispatch:
    inputs:
      release_run:
        description: "Approved production-release workflow run ID"
        required: true
        type: string
      source_sha:
        description: "Full commit SHA validated by the approved release"
        required: true
        type: string
      schema_only:
        description: "Apply schema and runtime grants without bootstrap/import"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify approved release run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -Eeuo pipefail
          run_json="$(gh run view "$RELEASE_RUN" --json status,conclusion,headSha,event)"
          test "$(jq -r .status <<<"$run_json")" = completed
          test "$(jq -r .conclusion <<<"$run_json")" = success
          test "$(jq -r .headSha <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r .event <<<"$run_json")" = workflow_dispatch

      - name: Install PostgreSQL client and sqlx CLI
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client openssh-client
          cargo install sqlx-cli --version 0.8.6 --no-default-features --features rustls,postgres

      - name: Open restricted database tunnel
        env:
          DB_TUNNEL_KEY: ${{ secrets.ERP_DB_TUNNEL_KEY }}
          DB_KNOWN_HOSTS: ${{ secrets.ERP_DB_KNOWN_HOSTS }}
          DB_SSH_HOST: ${{ secrets.ERP_DB_SSH_HOST }}
        run: |
          set -Eeuo pipefail
          install -d -m 700 "$RUNNER_TEMP/erp-db"
          install -m 600 /dev/stdin "$RUNNER_TEMP/erp-db/id_ed25519" <<<"$DB_TUNNEL_KEY"
          install -m 600 /dev/stdin "$RUNNER_TEMP/erp-db/known_hosts" <<<"$DB_KNOWN_HOSTS"
          ssh -fNT \
            -i "$RUNNER_TEMP/erp-db/id_ed25519" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ExitOnForwardFailure=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/erp-db/known_hosts" \
            -L 127.0.0.1:15432:172.17.0.1:5432 \
            "$DB_SSH_HOST"

      - name: Apply migrations
        if: ${{ inputs.schema_only == true }}
        env:
          DATABASE_URL: ${{ secrets.ERP_MIGRATION_DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          test -n "$DATABASE_URL"
          sqlx migrate run --source migrations --database-url "$DATABASE_URL"

      - name: Apply restricted runtime grants
        if: ${{ inputs.schema_only == true }}
        env:
          DATABASE_URL: ${{ secrets.ERP_MIGRATION_DATABASE_URL }}
        run: |
          set -Eeuo pipefail
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/grant-cte-distribution.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/grant-fiscal-monitor.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f deploy/grant-commercial-contracts.sql

      - name: Refuse unimplemented bootstrap mode
        if: ${{ inputs.schema_only == false }}
        run: |
          echo "bootstrap/import requires the separately reviewed migration procedure" >&2
          exit 1
