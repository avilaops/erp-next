name: Production data migration
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Validated source commit
        required: true
        type: string
      release_run:
        description: Successful Production release run
        required: true
        type: string
      schema_only:
        description: Apply schema without bootstrap or legacy reimport
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: erp-production-migration
  cancel-in-progress: false
jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      DATABASE_URL: ${{ secrets.ERP_MIGRATION_DATABASE_URL }}
      ERP_LEGACY_DATABASE_URL: ${{ secrets.ERP_LEGACY_DATABASE_URL }}
      ERP_BOOTSTRAP_SUB: ${{ secrets.ERP_BOOTSTRAP_SUB }}
      ERP_BOOTSTRAP_TENANT: ${{ secrets.ERP_BOOTSTRAP_TENANT }}
      ERP_BOOTSTRAP_EMAIL: nicolas@avilaops.com
      SOURCE_REF: ${{ inputs.source_ref }}
      RELEASE_RUN: ${{ inputs.release_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Require approved images
        run: |
          [[ "$SOURCE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN" --jq .conclusion)" = success
          git fetch --depth=1 origin "$SOURCE_REF"
          git diff --exit-code FETCH_HEAD HEAD -- apps/api Cargo.toml Cargo.lock migrations
          gh run download "$RELEASE_RUN" --repo "$GITHUB_REPOSITORY" --name "erp-api-$SOURCE_REF"
          docker load --input api-image.tar.gz
      - name: Open restricted database tunnel
        env:
          SSH_KEY: ${{ secrets.ERP_DB_TUNNEL_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.ERP_DB_KNOWN_HOSTS }}
          SSH_HOST: ${{ secrets.ERP_DB_SSH_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/erp-db
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/erp-db ~/.ssh/known_hosts
          ssh -o BatchMode=yes -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes -i ~/.ssh/erp-db -N -f -L 127.0.0.1:15435:172.17.0.1:5432 root@"$SSH_HOST"
      - name: Route database connections through the restricted tunnel
        run: |
          python3 - <<'PY'
          import os
          from urllib.parse import urlsplit, urlunsplit

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              for name in ("DATABASE_URL", "ERP_LEGACY_DATABASE_URL"):
                  value = os.environ[name]
                  if any(character in value for character in ("\n", "\r")):
                      raise ValueError(f"Invalid database URL in {name}")
                  parsed = urlsplit(value)
                  if parsed.scheme not in ("postgres", "postgresql") or not parsed.username:
                      raise ValueError(f"Invalid database URL in {name}")
                  credentials = parsed.netloc.rsplit("@", 1)[0]
                  tunneled = urlunsplit(parsed._replace(netloc=credentials + "@127.0.0.1:15435"))
                  print("::add-mask::" + tunneled)
                  output.write(name + "=" + tunneled + "\n")
          PY
      - name: Apply destination migrations
        run: docker run --rm --network host --env DATABASE_URL "erp-next-api:sha-$SOURCE_REF" migrate
      - name: Provision initial membership
        if: ${{ !inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f deploy/bootstrap.sql
      - name: Grant invitation storage to the existing runtime role
        if: ${{ inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE, DELETE ON user_invitations TO erp_next_app'
      - name: Grant commercial contract storage to the existing runtime role
        if: ${{ inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON commercial_contracts TO erp_next_app; GRANT SELECT, INSERT ON commercial_contract_files, commercial_contract_webhooks TO erp_next_app'
      - name: Grant private template storage to the existing runtime role
        if: ${{ inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON commercial_template_drafts, commercial_template_versions TO erp_next_app'
      - name: Grant encrypted fiscal certificate storage to the existing runtime role
        if: ${{ inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON fiscal_a1_certificates TO erp_next_app'
      - name: Grant fiscal monitor storage to the existing runtime role
        if: ${{ inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f deploy/grant-fiscal-monitor.sql
      - name: Grant personal preferences to the existing runtime role
        if: ${{ inputs.schema_only }}
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c 'GRANT SELECT, INSERT, UPDATE ON personal_preferences, financial_settings TO erp_next_app'
      - name: Import and reconcile the complete legacy database
        if: ${{ !inputs.schema_only }}
        run: python3 scripts/import-legacy.py
