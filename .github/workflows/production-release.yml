name: Production release
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to validate and package
        required: true
        type: string
permissions:
  contents: read
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_isolated_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/erp_next_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace -- --test-threads=2
      - run: cargo build --release --locked -p erp-next-api
      - run: docker build -f deploy/api.Dockerfile -t erp-next-api:sha-${{ inputs.source_ref }} .
      - run: docker save erp-next-api:sha-${{ inputs.source_ref }} | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-api-${{ inputs.source_ref }}
          path: api-image.tar.gz
          compression-level: 0
          retention-days: 7
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - run: pnpm --filter web build
      - run: pnpm --filter web test:danfe
        env:
          ERP_BROWSER_CHANNEL: chrome
      - name: Build the technical contract validation template
        run: node scripts/contracts/build-validation-template.mjs
        env:
          ERP_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        with:
          name: erp-contract-model-${{ inputs.source_ref }}
          path: artifacts/contract-validation/
          retention-days: 7
      - run: docker build -f deploy/web.Dockerfile -t erp-next-web:sha-${{ inputs.source_ref }} .
      - run: docker save erp-next-web:sha-${{ inputs.source_ref }} | gzip > web-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-web-${{ inputs.source_ref }}
          path: web-image.tar.gz
          compression-level: 0
          retention-days: 7
