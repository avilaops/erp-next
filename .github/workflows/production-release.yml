name: Production release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Exact source commit to validate and package
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  fiscal-mcp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.24
      - run: uv sync --frozen --extra dev --python 3.12
        working-directory: apps/fiscal-mcp
      - run: node --test scripts/fiscal/test/deploy-config.test.mjs
      - run: uv run --frozen --extra dev pytest tests/test_fiscal_schema.py tests/test_simplified_danfe.py tests/test_nfe_assinatura.py
        working-directory: apps/fiscal-mcp
      - run: docker build -f apps/fiscal-mcp/Dockerfile -t erp-next-fiscal-mcp:sha-${{ inputs.source_ref || github.sha }} .
      - name: Exercise MCP in its restricted runtime container
        shell: bash
        run: |
          docker run --detach --name fiscal-mcp-smoke --network host --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m,mode=1777 --security-opt no-new-privileges:true --cap-drop ALL --memory 512m --pids-limit 128 -e XDG_CACHE_HOME=/tmp/cache erp-next-fiscal-mcp:sha-${{ inputs.source_ref || github.sha }}
          trap 'docker rm -f fiscal-mcp-smoke >/dev/null 2>&1 || true' EXIT
          cd apps/fiscal-mcp
          uv run --frozen --extra dev python scripts/smoke_runtime.py
      - run: docker save erp-next-fiscal-mcp:sha-${{ inputs.source_ref || github.sha }} | gzip > fiscal-mcp-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-fiscal-mcp-${{ inputs.source_ref || github.sha }}
          path: fiscal-mcp-image.tar.gz
          compression-level: 0
          retention-days: 7
  fiscal-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/fiscal-engine
      - run: npm test
        working-directory: apps/fiscal-engine
      - run: docker build -f apps/fiscal-engine/Dockerfile -t erp-next-fiscal:sha-${{ inputs.source_ref || github.sha }} .
      - run: docker save erp-next-fiscal:sha-${{ inputs.source_ref || github.sha }} | gzip > fiscal-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-fiscal-${{ inputs.source_ref || github.sha }}
          path: fiscal-image.tar.gz
          compression-level: 0
          retention-days: 7
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp_next_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_isolated_only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:ci_isolated_only@127.0.0.1:5432/erp_next_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test and export the exact source contract
        run: |
          mkdir -p artifacts/contracts
          ERP_OPENAPI_OUTPUT="$PWD/artifacts/contracts/candidate.json" cargo test --locked --workspace -- --test-threads=2
      - uses: actions/upload-artifact@v4
        with:
          name: erp-release-openapi-${{ inputs.source_ref || github.sha }}
          path: artifacts/contracts/candidate.json
          if-no-files-found: error
          retention-days: 7
      - run: cargo build --release --locked -p erp-next-api
      - run: docker build -f deploy/api.Dockerfile -t erp-next-api:sha-${{ inputs.source_ref || github.sha }} .
      - run: docker save erp-next-api:sha-${{ inputs.source_ref || github.sha }} | gzip > api-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-api-${{ inputs.source_ref || github.sha }}
          path: api-image.tar.gz
          compression-level: 0
          retention-days: 7
  web:
    needs: api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.11.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web lint
      - uses: actions/download-artifact@v4
        with:
          name: erp-release-openapi-${{ inputs.source_ref || github.sha }}
          path: artifacts/contracts/
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: scripts/contracts/consumer
      - run: node scripts/contracts/generate-web.mjs
      - run: node --test tests/fiscal-tax-model.node.mjs
        working-directory: apps/web
      - run: pnpm --filter web build
      - name: Reserve browser fixture ports outside ephemeral allocation
        run: sudo sysctl -w net.ipv4.ip_local_reserved_ports=33118-33120,33128-33130,33928-33929,33941
      - run: timeout 600s pnpm --filter web test:danfe
        env:
          ERP_BROWSER_CHANNEL: chrome
      - run: timeout 120s pnpm --filter web test:monitor
        env:
          ERP_BROWSER_CHANNEL: chrome
      - name: Build the technical contract validation template
        run: node scripts/contracts/build-validation-template.mjs
        env:
          ERP_BROWSER_CHANNEL: chrome
      - uses: actions/upload-artifact@v4
        with:
          name: erp-contract-model-${{ inputs.source_ref || github.sha }}
          path: artifacts/contract-validation/
          retention-days: 7
      - run: docker build -f deploy/web.Dockerfile -t erp-next-web:sha-${{ inputs.source_ref || github.sha }} .
      - run: docker save erp-next-web:sha-${{ inputs.source_ref || github.sha }} | gzip > web-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: erp-web-${{ inputs.source_ref || github.sha }}
          path: web-image.tar.gz
          compression-level: 0
          retention-days: 7

  mlops-evidence:
    name: MLOps verified release evidence
    needs: [fiscal-engine, fiscal-mcp, api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
      NEEDS_JSON: ${{ toJSON(needs) }}
      MLOPS_ARTIFACTS_DIR: artifacts/mlops-input
    steps:
      - name: Checkout exact evaluated source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Download actual OpenAPI contract from API job
        uses: actions/download-artifact@v4
        with:
          name: erp-release-openapi-${{ inputs.source_ref || github.sha }}
          path: artifacts/mlops-input/contracts
      - name: Download actual browser-validated template from web job
        uses: actions/download-artifact@v4
        with:
          name: erp-contract-model-${{ inputs.source_ref || github.sha }}
          path: artifacts/mlops-input/validation
      - name: Validate source, job outcomes, contract and evidence digests
        run: node scripts/mlops/release-gate.mjs
      - name: Preserve signed-by-digest evidence
        uses: actions/upload-artifact@v4
        with:
          name: erp-mlops-evidence-${{ inputs.source_ref || github.sha }}-${{ github.run_attempt }}
          path: artifacts/mlops-release/
          retention-days: 30
          if-no-files-found: error

  deploy:
    name: Deploy production
    needs: [fiscal-engine, fiscal-mcp, api, web, mlops-evidence]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      actions: read
    concurrency:
      group: erp-production-deploy
      cancel-in-progress: false
    env:
      SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: erp-api-${{ inputs.source_ref || github.sha }}
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: erp-web-${{ inputs.source_ref || github.sha }}
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: erp-fiscal-${{ inputs.source_ref || github.sha }}
          path: bundle
      - uses: actions/download-artifact@v4
        with:
          name: erp-fiscal-mcp-${{ inputs.source_ref || github.sha }}
          path: bundle
      - name: Send immutable release to applications
        env:
          DEPLOY_HOST: ${{ secrets.ERP_DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.ERP_DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.ERP_DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.ERP_DEPLOY_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DEPLOY_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          test -s bundle/api-image.tar.gz
          test -s bundle/web-image.tar.gz
          test -s bundle/fiscal-image.tar.gz
          test -s bundle/fiscal-mcp-image.tar.gz
          bundle_dir=$(mktemp -d)
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$bundle_dir" "$ssh_dir"' EXIT
          cp bundle/api-image.tar.gz bundle/web-image.tar.gz bundle/fiscal-image.tar.gz bundle/fiscal-mcp-image.tar.gz "$bundle_dir/"
          cp deploy/compose.yaml deploy/fiscal-compose.yaml "$bundle_dir/"
          chmod 700 "$ssh_dir"
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          chmod 600 "$ssh_dir/key" "$ssh_dir/known_hosts"
          tar -C "$bundle_dir" -czf - . | ssh -T \
            -i "$ssh_dir/key" -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy erp-next $SOURCE_SHA"

