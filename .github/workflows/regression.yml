name: Full regression
'on':
  schedule:
  - cron: 23 4 * * 1
  workflow_dispatch:
    inputs:
      task:
        type: choice
        options:
        - regression
        - contracts-portal
        default: regression
        description: Validation only; does not deploy the ERP
permissions:
  contents: read
concurrency:
  group: regression-${{ github.ref }}-${{ inputs.task }}
  cancel-in-progress: true
jobs:
  api:
    if: github.event_name == 'schedule' || inputs.task == 'regression'
    uses: ./.github/workflows/_validate-api.yml
    with:
      source_sha: ${{ github.sha }}
      full: true
      publish: false
  web:
    if: github.event_name == 'schedule' || inputs.task == 'regression'
    uses: ./.github/workflows/_validate-web.yml
    with:
      source_sha: ${{ github.sha }}
      full: true
      publish: false
      openapi_artifact_name: ${{ needs.api.outputs.openapi_artifact_name }}
    needs:
    - api
  fiscal:
    if: github.event_name == 'schedule' || inputs.task == 'regression'
    uses: ./.github/workflows/_validate-fiscal.yml
    with:
      source_sha: ${{ github.sha }}
      full: true
      publish: false
  project:
    if: github.event_name == 'schedule' || inputs.task == 'regression'
    uses: ./.github/workflows/_validate-project.yml
    with:
      source_sha: ${{ github.sha }}
      full: true
      publish: false
      openapi_artifact_name: ${{ needs.api.outputs.openapi_artifact_name }}
    needs:
    - api
  contracts-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports:
        - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 3s --health-retries 20
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: avila_contracts_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: portal_ci_only
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
    - uses: actions/checkout@v4
    - name: Prepare corresponding source with original license and attribution
      run: 'curl --fail --location --retry 2 https://github.com/docusealco/docuseal/archive/8f8f69f0bc6ac2e59746cd6efac54a852289bec3.tar.gz -o upstream.tar.gz

        mkdir corresponding-source

        tar -xzf upstream.tar.gz -C corresponding-source --strip-components=1

        cp -R deploy/contracts-portal/overlay/. corresponding-source/

        cp deploy/contracts-portal/README.md corresponding-source/AVILA-OPS-SOURCE.md

        cp deploy/contracts-portal/Dockerfile corresponding-source/AVILA-OPS-Dockerfile

        cp -R deploy/contracts-portal/tests corresponding-source/avila-tests

        test -s corresponding-source/LICENSE

        grep -q ''retain the original DocuSeal attribution'' corresponding-source/LICENSE_ADDITIONAL_TERMS

        tar -czf deploy/contracts-portal/avila-source.tar.gz -C corresponding-source .

        '
    - name: Build branded portal
      run: docker build --build-arg RELEASE_SHA="$GITHUB_SHA" -t "avila-contracts:sha-$GITHUB_SHA" deploy/contracts-portal
    - name: Validate overlay syntax and retained attribution
      run: 'docker run --rm --entrypoint sh "avila-contracts:sha-$GITHUB_SHA" -c ''find /app/app/views -name "*.erb" -path "*/shared/_title.html.erb" -exec erb -P
        -x -T - {} \; | ruby -c''

        docker run --rm --entrypoint sh "avila-contracts:sha-$GITHUB_SHA" -c ''test -s /app/public/avila-source.tar.gz && grep -q DocuSeal /app/app/views/shared/_powered_by.html.erb''

        '
    - name: Package immutable image
      run: "docker run --rm --network host --entrypoint sh -w /app \\\n  -e RAILS_ENV=production -e AVILA_PUBLICATION_TEST=true \\\n  -e REDIS_URL=redis://127.0.0.1:6379/0\
        \ \\\n  -e DATABASE_URL=postgres://postgres:portal_ci_only@127.0.0.1:5432/avila_contracts_ci \\\n  -e SECRET_KEY_BASE=avila-ci-disposable-publication-secret-key-not-production\
        \ \\\n  -v \"$PWD/deploy/contracts-portal/tests:/avila-tests:ro\" \\\n  \"avila-contracts:sha-$GITHUB_SHA\" -c 'bundle exec rails db:prepare && bundle exec\
        \ rails runner /avila-tests/publication.rb && bundle exec rails runner /avila-tests/public_access.rb'\n"
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Publish validated portal image
      run: 'docker tag "avila-contracts:sha-$GITHUB_SHA" "ghcr.io/avilaops/contracts-portal:sha-$GITHUB_SHA"

        docker push "ghcr.io/avilaops/contracts-portal:sha-$GITHUB_SHA"'
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'contracts-portal'
    permissions:
      contents: read
      packages: write
