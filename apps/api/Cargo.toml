[package]
name = "erp-next-api"
version = "0.1.0"
edition.workspace = true
default-run = "erp-next-api"
license.workspace = true
rust-version.workspace = true

[dependencies]
pdf-writer = "=0.15.0"
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
tower = { version = "0.5", features = ["util"] }
base64 = "=0.22.1"
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
flate2 = "1"
sha1 = { version = "0.10", features = ["oid"] }
aes-gcm = "=0.10.3"
p12-keystore = "=0.4.1"
rsa = "=0.9.10"
rustls-pki-types = "=1.15.1"
rustls-webpki = { version = "=0.103.16", features = ["ring", "std"] }
x509-parser = "=0.18.1"
zeroize = { version = "=1.9.1", features = ["derive", "serde"] }
opentelemetry = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace"] }
opentelemetry-otlp = { version = "=0.33.1", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client", "reqwest-rustls"] }
roxmltree = "=0.21.1"
sha2 = "=0.10.9"
anyhow.workspace = true
axum.workspace = true
reqwest.workspace = true
lettre.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-stream = "0.1"
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
utoipa.workspace = true

[dev-dependencies]
lopdf = { version = "=0.38.0", default-features = false }
opentelemetry_sdk = { version = "=0.33.1", default-features = false, features = ["trace", "testing"] }
tower = { version = "0.5", features = ["util"] }

