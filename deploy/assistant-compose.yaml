name: erp-assistant
services:
  ollama:
    # CPU distribution maintained by alpine-docker; validated and pinned by digest.
    image: alpine/ollama@sha256:d81e4e3a38eefb991891fd1a19e3e34832e239ea4b0c211cdde9a70c13b882e6
    container_name: erp-assistant-ollama
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    ports: ["127.0.0.1:11434:11434"]
    volumes: ["models:/root/.ollama"]
    environment:
      OLLAMA_NO_CLOUD: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "1"
      OLLAMA_CONTEXT_LENGTH: "4096"
  gateway:
    image: caddy@sha256:eb4d35b7452d1ab6171fbdbe8d9275b2301dad6dad92115d91e19fb9b24d510f
    restart: unless-stopped
    network_mode: host
    user: "65534:65534"
    # The official Caddy executable carries this file capability.
    cap_add: [NET_BIND_SERVICE]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.15
    pids_limit: 64
    read_only: true
    tmpfs:
      - /config:size=8m,uid=65534,gid=65534
      - /data:size=8m,uid=65534,gid=65534
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    volumes: ["./assistant.Caddyfile:/etc/caddy/Caddyfile:ro"]
volumes:
  models:
    external: true
    name: erp-assistant-ollama
