name: avilaops-erp-contracts-validator
services:
  worker:
    image: ${VALIDATOR_IMAGE:?Configure a imagem aprovada por digest}
    command: [worker]
    user: '10002:10001'
    network_mode: none
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 1g
    cpus: 1.0
    ulimits:
      core: 0
      nofile: 128
    volumes:
      - channel:/run/validator:rw
      - ${VALIDATOR_PUBLIC_CONFIG:?Configure os arquivos publicos}:/config/public:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
  gateway:
    image: ${VALIDATOR_IMAGE:?Configure a imagem aprovada por digest}
    command: [gateway]
    user: '10001:10001'
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    pids_limit: 32
    mem_limit: 1g
    cpus: 1.0
    ulimits:
      core: 0
      nofile: 128
    depends_on: [worker]
    networks: [private]
    volumes:
      - channel:/run/validator:ro
      - ${VALIDATOR_PUBLIC_CONFIG:?Configure os arquivos publicos}:/config/public:ro
      - ${VALIDATOR_SECRETS:?Configure os segredos dedicados}:/run/secrets/validator:ro
    logging:
      driver: json-file
      options: {max-size: 5m, max-file: '2'}
networks:
  private: {}
volumes:
  channel: {}
