services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: erp_next
      POSTGRES_USER: erp_next
      POSTGRES_PASSWORD: erp_next_local
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_next -d erp_next"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - erp-next-postgres:/var/lib/postgresql

volumes:
  erp-next-postgres:

